name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update to (e.g. v0.1.1)'
        required: true
        type: string

env:
  FORMULA_NAME: rslack

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          # Get SHA256 hashes from release files, failing if a file is missing
          release_url="https://github.com/kohbis/${FORMULA_NAME}/releases/download/${VERSION}"
          sha256_of() {
            local sha256
            sha256=$(curl -fsSL "${release_url}/${FORMULA_NAME}-$1.sha256" | cut -d' ' -f1)
            if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid sha256 for $1: $sha256" >&2
              exit 1
            fi
            echo "$sha256"
          }
          MACOS_SHA256=$(sha256_of macos)
          LINUX_SHA256=$(sha256_of linux)

          # Update formula file
          formula="Formula/${FORMULA_NAME}.rb"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$formula"
          sed -i "s/sha256 \".*\" # macos/sha256 \"${MACOS_SHA256}\" # macos/" "$formula"
          sed -i "s/sha256 \".*\" # linux/sha256 \"${LINUX_SHA256}\" # linux/" "$formula"

          # Create branch and commit
          branch="update-formula-${VERSION}"
          git checkout -b "$branch"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add "$formula"
          git commit -m "Update formula to ${VERSION}"
          git push origin "$branch"

          # Create PR
          gh pr create \
            --base main \
            --title "Update formula to ${VERSION}" \
            --body "This PR updates the formula to version ${VERSION}."
